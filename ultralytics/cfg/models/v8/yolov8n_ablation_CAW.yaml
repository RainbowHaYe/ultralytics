# YOLOv8n + SimC2f + CoordAtt + WAFF (C+W 组合)
# ============================================================================
# 消融实验: SimC2f 基底 + 坐标注意力(C) + 自适应融合(W)
# ============================================================================

nc: 7
scales:
  n: [0.25, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]              # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]             # 1-P2/4
  - [-1, 2, SimC2f, [128, True]]            # 2
  - [-1, 1, Conv, [256, 3, 2]]             # 3-P3/8
  - [-1, 6, SimC2f, [256, True]]            # 4
  - [-1, 1, Conv, [512, 3, 2]]             # 5-P4/16
  - [-1, 6, SimC2f, [512, True]]            # 6
  - [-1, 1, Conv, [1024, 3, 2]]            # 7-P5/32
  - [-1, 2, SimC2f, [1024, True]]           # 8
  - [-1, 1, SPPF, [1024, 5]]               # 9
  - [-1, 1, CoordAtt, []]                   # 10 ── C

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 11
  - [[-1, 6], 1, WAFF, []]                        # 12 ── W
  - [-1, 2, SimC2f, [512]]                          # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 14
  - [[-1, 4], 1, WAFF, []]                        # 15 ── W
  - [-1, 2, SimC2f, [256]]                          # 16 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]                    # 17
  - [[-1, 13], 1, Concat, [1]]                     # 18
  - [-1, 2, SimC2f, [512]]                          # 19 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]                    # 20
  - [[-1, 10], 1, Concat, [1]]                     # 21
  - [-1, 2, SimC2f, [1024]]                         # 22 (P5/32-large)

  - [[16, 19, 22], 1, Detect, [nc]]               # 23
