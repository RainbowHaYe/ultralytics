# YOLOv8n + SimC2f 轻量化基线 (无 S/C/W 创新)
# ============================================================================
# 消融实验对照组: 仅将 C2f 替换为 SimC2f (1×1+3×3 简化 Bottleneck)
# 用于衡量 SimC2f 轻量化策略本身的影响
# ============================================================================

nc: 7
scales:
  n: [0.25, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]              # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]             # 1-P2/4  (标准 Conv stride-2)
  - [-1, 2, SimC2f, [128, True]]            # 2
  - [-1, 1, Conv, [256, 3, 2]]             # 3-P3/8
  - [-1, 6, SimC2f, [256, True]]            # 4
  - [-1, 1, Conv, [512, 3, 2]]             # 5-P4/16
  - [-1, 6, SimC2f, [512, True]]            # 6
  - [-1, 1, Conv, [1024, 3, 2]]            # 7-P5/32
  - [-1, 2, SimC2f, [1024, True]]           # 8
  - [-1, 1, SPPF, [1024, 5]]               # 9

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 10
  - [[-1, 6], 1, Concat, [1]]                      # 11
  - [-1, 2, SimC2f, [512]]                          # 12

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 13
  - [[-1, 4], 1, Concat, [1]]                      # 14
  - [-1, 2, SimC2f, [256]]                          # 15 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]                    # 16
  - [[-1, 12], 1, Concat, [1]]                     # 17
  - [-1, 2, SimC2f, [512]]                          # 18 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]                    # 19
  - [[-1, 9], 1, Concat, [1]]                      # 20
  - [-1, 2, SimC2f, [1024]]                         # 21 (P5/32-large)

  - [[15, 18, 21], 1, Detect, [nc]]               # 22
