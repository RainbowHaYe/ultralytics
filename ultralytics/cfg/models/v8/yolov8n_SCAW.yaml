# YOLO-SCAW: YOLOv8n + SPDLiteConv + Coordinate Attention + WAFF
# ============================================================================
# 轻量化工业小零件检测模型
#
# ✦ 模型命名解释:
#   S  — SPDLiteConv       (无损轻量化下采样)
#   CA — Coordinate Attention / CoordAtt  (坐标感知注意力)
#   W  — WAFF              (加权自适应特征融合)
#   → YOLO-SCAW = S + CA + W  (三项核心创新)
#
# ✦ 三项核心创新 (论文贡献点):
# 创新1 - SPDLiteConv (S - 无损轻量化下采样):
#   全面替换backbone中所有stride-2下采样卷积为SPDLiteConv,
#   通过PixelUnshuffle+1x1融合实现无损空间信息保护, 尤其利于小零件检测。
#   相比原版SPDConv(3x3融合)进一步将融合层参数量减少88.9%。
#
# 创新2 - CoordAtt / Coordinate Attention (CA - 坐标感知注意力):
#   在SPPF后引入坐标注意力, 沿H和W方向分别池化编码位置信息,
#   为小零件提供精确的空间定位能力, 克服SE-Net/CBAM全局池化
#   丢失位置信息的缺陷。
#
# 创新3 - WAFF (W - 加权自适应特征融合):
#   在Neck的top-down路径中用WAFF替代标准Concat,
#   结合BiFPN可学习加权 + ECA通道注意力实现自适应多尺度融合,
#   显著降低过检率（FP减少96个，过检率改善8.2%）。
#
# ✦ 辅助轻量化设计（非命名贡献点）:
# - SimC2f替代C2f: Bottleneck从3x3+3x3精简为1x1+3x3，减少44%瓶颈层参数量
#   （与命名无关，作为整体轻量化框架的支撑策略）
#
# ✦ 整体设计目标: GFLOPs ≤ 7.0, Params < baseline(3.01M)
#
# 模型命名: YOLO-SCAW (SPDLiteConv + Coordinate Attention + WAFF)
# ============================================================================

# Parameters
nc: 7
scales:
  n: [0.25, 0.25, 1024]

# Backbone: 全SPDLiteConv下采样 + SimC2f特征提取 + SPPF + CoordAtt
backbone:
  - [-1, 1, Conv, [64, 3, 2]]              # 0-P1/2 (RGB 3ch输入, 保持标准Conv)
  - [-1, 1, SPDLiteConv, [128, 1, 2]]      # 1-P2/4 ── 创新1: SPDLiteConv无损下采样
  - [-1, 2, SimC2f, [128, True]]            # 2 - SimC2f轻量特征提取
  - [-1, 1, SPDLiteConv, [256, 1, 2]]      # 3-P3/8 ── 创新1: SPDLiteConv无损下采样
  - [-1, 6, SimC2f, [256, True]]            # 4 - effective repeat=2, 保持精度
  - [-1, 1, SPDLiteConv, [512, 1, 2]]      # 5-P4/16 ── 创新1: SPDLiteConv无损下采样
  - [-1, 6, SimC2f, [512, True]]            # 6 - effective repeat=2, 保持精度
  - [-1, 1, SPDLiteConv, [1024, 1, 2]]     # 7-P5/32 ── 创新1: SPDLiteConv无损下采样
  - [-1, 2, SimC2f, [1024, True]]           # 8 - SimC2f轻量特征提取
  - [-1, 1, SPPF, [1024, 5]]               # 9 - k=5 多尺度感受野
  - [-1, 1, CoordAtt, []]                   # 10 ── 创新2: CoordAtt坐标注意力

# Head: WAFF自适应融合(top-down) + Concat(bottom-up) + SimC2f
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 11
  - [[-1, 6], 1, WAFF, []]                        # 12 ── 创新3: WAFF自适应融合
  - [-1, 2, SimC2f, [512]]                         # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 14
  - [[-1, 4], 1, WAFF, []]                        # 15 ── 创新3: WAFF自适应融合
  - [-1, 2, SimC2f, [256]]                         # 16 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]                    # 17
  - [[-1, 13], 1, Concat, [1]]                    # 18
  - [-1, 2, SimC2f, [512]]                         # 19 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]                    # 20
  - [[-1, 10], 1, Concat, [1]]                    # 21
  - [-1, 2, SimC2f, [1024]]                        # 22 (P5/32-large)

  - [[16, 19, 22], 1, Detect, [nc]]               # 23 Detect(P3, P4, P5)
